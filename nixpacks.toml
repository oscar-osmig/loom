[phases.setup]
nixPkgs = ["nodejs_20", "python312"]

[phases.frontend]
dependsOn = ["setup"]
cmds = ["cd frontend && npm install && npm run build"]

[phases.install]
dependsOn = ["frontend"]
cmds = ["pip install -r requirements.txt"]

[start]
# Production WSGI server. Single worker on purpose — the in-memory knowledge
# graph and background inference daemon are per-process state; threads provide
# request concurrency.
cmd = "gunicorn main:app --workers 1 --threads 8 --timeout ${GUNICORN_TIMEOUT:-300} --bind 0.0.0.0:${PORT:-5000}"
